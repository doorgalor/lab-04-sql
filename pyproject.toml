[project]
name = "sql-lab"
version = "0.1.0"
description = "sql work for DS2022"
authors = [
    { name = "Daniel Lim", email = "dannylim802@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mysql-connector-python>=26.7.0",
    "pandas>=3.0.6",
]

[project.scripts]
sql-lab = "sql_lab:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
